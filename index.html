<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<title>
AIスタックチャン Ultimate
</title>

<style>

:root{

--bg:#10151d;
--panel:#1b2430;
--face:#243447;
--accent:#00ffd0;
--text:#ffffff;
--danger:#ff5f57;

}

*{

margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;

}

html,
body{

width:100%;
height:100%;

background:var(--bg);
color:var(--text);

font-family:
sans-serif;

overflow:hidden;

}

body{

display:flex;
flex-direction:column;
align-items:center;

}

/* ======================
   FACE
====================== */

#faceArea{

padding-top:18px;

}

#face{

width:min(90vw,340px);
height:min(62vw,230px);

background:var(--face);

border-radius:40px;

position:relative;

box-shadow:
0 15px 30px
rgba(0,0,0,.4);

transition:.25s;

overflow:hidden;

}

.eye{

position:absolute;

width:52px;
height:52px;

border-radius:50%;

background:var(--accent);

top:70px;

transition:.15s;

}

#eyeL{

left:65px;

}

#eyeR{

right:65px;

}

#mouth{

position:absolute;

left:50%;
bottom:55px;

transform:
translateX(-50%);

width:54px;
height:18px;

background:var(--accent);

border-radius:8px;

transition:.08s;

}

/* ======================
   STATUS
====================== */

#status{

margin-top:12px;

width:min(95vw,700px);

padding:10px;

background:var(--panel);

border-radius:12px;

font-size:14px;

text-align:center;

min-height:42px;

}

/* ======================
   BUTTONS
====================== */

#buttonBar{

display:flex;

gap:8px;

margin-top:10px;

flex-wrap:wrap;

justify-content:center;

}

button{

border:none;

border-radius:12px;

padding:12px 16px;

font-size:15px;

font-weight:bold;

cursor:pointer;

}

#talkBtn{

background:#2ecc71;
color:white;

}

#stopBtn{

background:#e74c3c;
color:white;

}

#clearBtn{

background:#3498db;
color:white;

}

/* ======================
   SETTINGS
====================== */

#settings{

margin-top:12px;

width:min(95vw,700px);

background:var(--panel);

padding:12px;

border-radius:12px;

}

#settings h3{

margin-bottom:8px;

}

#apiKey{

width:100%;

padding:10px;

border:none;

border-radius:8px;

}

.settingRow{

display:flex;

gap:8px;

margin-top:8px;

}

.settingRow button{

flex:1;

}

/* ======================
   HISTORY
====================== */

#history{

margin-top:12px;

width:min(95vw,700px);

flex:1;

overflow:auto;

background:var(--panel);

border-radius:12px;

padding:12px;

margin-bottom:12px;

}

.message{

padding:8px;

border-radius:10px;

margin-bottom:8px;

line-height:1.5;

word-break:break-word;

}

.user{

background:#34495e;

}

.ai{

background:#22313f;

border-left:
4px solid var(--accent);

}

/* ======================
   MOBILE
====================== */

@media(max-width:500px){

.eye{

width:42px;
height:42px;

top:60px;

}

#eyeL{

left:50px;

}

#eyeR{

right:50px;

}

}

</style>

</head>

<body>

<div id="faceArea">

<div id="face">

<div
id="eyeL"
class="eye">
</div>

<div
id="eyeR"
class="eye">
</div>

<div
id="mouth">
</div>

</div>

</div>

<div id="status">

Gemini APIキーを設定してください

</div>

<div id="buttonBar">

<button id="talkBtn">
🎤 話しかける
</button>

<button id="stopBtn">
🔇 停止
</button>

<button id="clearBtn">
🗑 履歴削除
</button>

</div>

<div id="settings">

<h3>
設定
</h3>

<input
type="password"
id="apiKey"
placeholder="Gemini API Key">

<div class="settingRow">

<button id="saveKeyBtn">
保存
</button>

<button id="testKeyBtn">
接続テスト
</button>

</div>

</div>

<div id="history">
</div>

<script>

/* ======================
   DOM
====================== */

const face =
document.getElementById(
'face'
);

const eyeL =
document.getElementById(
'eyeL'
);

const eyeR =
document.getElementById(
'eyeR'
);

const mouth =
document.getElementById(
'mouth'
);

const statusBox =
document.getElementById(
'status'
);

const historyBox =
document.getElementById(
'history'
);

const apiKeyInput =
document.getElementById(
'apiKey'
);

const talkBtn =
document.getElementById(
'talkBtn'
);

const stopBtn =
document.getElementById(
'stopBtn'
);

const clearBtn =
document.getElementById(
'clearBtn'
);

const saveKeyBtn =
document.getElementById(
'saveKeyBtn'
);

const testKeyBtn =
document.getElementById(
'testKeyBtn'
);

/* ======================
   SETTINGS
====================== */

let GEMINI_KEY =
localStorage.getItem(
'STACKCHAN_GEMINI_KEY'
) || '';

apiKeyInput.value =
GEMINI_KEY;

/* ======================
   FACE
====================== */

function faceNormal(){

face.style.background =
'#243447';

}

function faceListening(){

face.style.background =
'#2c3e50';

}

function faceThinking(){

face.style.background =
'#5d4037';

}

function faceHappy(){

face.style.background =
'#145a32';

}

function faceError(){

face.style.background =
'#7b241c';

}

/* ======================
   BLINK
====================== */

setInterval(()=>{

eyeL.style.height =
'5px';

eyeR.style.height =
'5px';

setTimeout(()=>{

eyeL.style.height =
'52px';

eyeR.style.height =
'52px';

},150);

},4000);

/* ======================
   HISTORY
====================== */

function addMessage(
type,
text
){

const div =
document.createElement(
'div'
);

div.className =
`message ${type}`;

div.textContent =
text;

historyBox.appendChild(
div
);

historyBox.scrollTop =
historyBox.scrollHeight;

}

/* ======================
   第2回
   APIキー保存
   履歴保存
   Gemini通信
   音声認識初期化
====================== */

/* ======================
   STATE
====================== */

let listening = false;

let speaking = false;

let recognition = null;

let conversationHistory =
JSON.parse(
localStorage.getItem(
'STACKCHAN_HISTORY'
) || '[]'
);

/* ======================
   HISTORY RESTORE
====================== */

conversationHistory.forEach(
item=>{

addMessage(
item.type,
item.text
);

}
);

function saveHistory(){

localStorage.setItem(
'STACKCHAN_HISTORY',
JSON.stringify(
conversationHistory
)
);

}

function pushHistory(
type,
text
){

conversationHistory.push({
type,
text
});

if(
conversationHistory.length > 100
){
conversationHistory.shift();
}

saveHistory();

}

/* ======================
   API KEY SAVE
====================== */

saveKeyBtn.addEventListener(
'click',
()=>{

const key =
apiKeyInput.value.trim();

if(!key){

alert(
'APIキーを入力してください'
);

return;

}

GEMINI_KEY = key;

localStorage.setItem(
'STACKCHAN_GEMINI_KEY',
key
);

statusBox.textContent =
'APIキーを保存しました';

faceHappy();

setTimeout(
faceNormal,
1000
);

}
);

/* ======================
   CLEAR HISTORY
====================== */

clearBtn.addEventListener(
'click',
()=>{

if(
!confirm(
'履歴を削除しますか？'
)
){
return;
}

conversationHistory = [];

localStorage.removeItem(
'STACKCHAN_HISTORY'
);

historyBox.innerHTML = '';

statusBox.textContent =
'履歴を削除しました';

}
);

/* ======================
   GEMINI
====================== */

async function askGemini(
userText
){

if(!GEMINI_KEY){

statusBox.textContent =
'APIキー未設定';

faceError();

return null;

}

try{

faceThinking();

statusBox.textContent =
'考え中...';

const response =
await fetch(

`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_KEY}`,

{
method:'POST',

headers:{
'Content-Type':
'application/json'
},

body:JSON.stringify({

contents:[{

parts:[{

text:
`あなたはスタックチャンです。

かわいい友達として話します。

日本語で返答。

50文字以内。

ユーザー:
${userText}`

}]

}],

generationConfig:{

temperature:0.8,

maxOutputTokens:80

}

})

}

);

if(!response.ok){

throw new Error(
response.status
);

}

const data =
await response.json();

const reply =
data?.candidates?.[0]
?.content?.parts?.[0]
?.text
?.trim();

if(!reply){

throw new Error(
'empty'
);

}

return reply;

}
catch(err){

console.error(err);

faceError();

statusBox.textContent =
'通信エラー';

return null;

}

}

/* ======================
   API TEST
====================== */

testKeyBtn.addEventListener(
'click',
async()=>{

const key =
apiKeyInput.value.trim();

if(!key){

alert(
'APIキーを入力してください'
);

return;

}

GEMINI_KEY = key;

statusBox.textContent =
'接続確認中...';

const result =
await askGemini(
'こんにちは'
);

if(result){

statusBox.textContent =
'接続成功';

faceHappy();

setTimeout(
faceNormal,
1000
);

}else{

statusBox.textContent =
'接続失敗';

faceError();

}

}
);

/* ======================
   SPEECH RECOGNITION
====================== */

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(SpeechRecognition){

recognition =
new SpeechRecognition();

recognition.lang =
'ja-JP';

recognition.interimResults =
false;

recognition.continuous =
false;

}else{

statusBox.textContent =
'音声認識非対応ブラウザ';

}

/* ======================
   第3回
   音声認識開始
   Gemini会話
   音声合成
   口パク
   停止ボタン
====================== */

/* ======================
   MOUTH
====================== */

let mouthTimer = null;

function startMouth(){

clearInterval(
mouthTimer
);

mouthTimer =
setInterval(()=>{

const h =
Math.floor(
Math.random()*35
)+8;

mouth.style.height =
`${h}px`;

},80);

}

function stopMouth(){

clearInterval(
mouthTimer
);

mouth.style.height =
'18px';

}

/* ======================
   SPEAK
====================== */

function speakText(
text
){

return new Promise(
resolve=>{

window.speechSynthesis.cancel();

const utter =
new SpeechSynthesisUtterance(
text
);

utter.lang =
'ja-JP';

utter.pitch = 1.2;

utter.rate = 1.05;

speaking = true;

faceHappy();

startMouth();

utter.onend = ()=>{

speaking = false;

stopMouth();

faceNormal();

resolve();

};

utter.onerror = ()=>{

speaking = false;

stopMouth();

faceNormal();

resolve();

};

window.speechSynthesis.speak(
utter
);

}
);

}

/* ======================
   TALK BUTTON
====================== */

talkBtn.addEventListener(
'click',
()=>{

if(!recognition){

alert(
'音声認識に対応していません'
);

return;

}

if(!GEMINI_KEY){

alert(
'APIキーを設定してください'
);

return;

}

if(listening){

return;

}

try{

listening = true;

faceListening();

statusBox.textContent =
'聞いています...';

recognition.start();

}
catch(err){

console.error(err);

listening = false;

}

}
);

/* ======================
   RECOGNITION RESULT
====================== */

if(recognition){

recognition.onresult =
async(event)=>{

const userText =
event.results[0][0]
.transcript
.trim();

listening = false;

addMessage(
'user',
`あなた: ${userText}`
);

pushHistory(
'user',
`あなた: ${userText}`
);

statusBox.textContent =
'考えています...';

faceThinking();

const reply =
await askGemini(
userText
);

if(!reply){

faceError();

statusBox.textContent =
'返答取得失敗';

return;

}

addMessage(
'ai',
`スタックチャン: ${reply}`
);

pushHistory(
'ai',
`スタックチャン: ${reply}`
);

statusBox.textContent =
reply;

await speakText(
reply
);

};

}

/* ======================
   RECOGNITION ERROR
====================== */

if(recognition){

recognition.onerror =
(event)=>{

console.error(
event
);

listening = false;

faceError();

statusBox.textContent =
'聞き取れませんでした';

setTimeout(
faceNormal,
1500
);

};

}

/* ======================
   RECOGNITION END
====================== */

if(recognition){

recognition.onend =
()=>{

listening = false;

if(!speaking){

faceNormal();

}

};

}

/* ======================
   STOP BUTTON
====================== */

stopBtn.addEventListener(
'click',
()=>{

window.speechSynthesis.cancel();

if(recognition){

try{

recognition.stop();

}
catch(e){}

}

listening = false;

speaking = false;

stopMouth();

faceNormal();

statusBox.textContent =
'停止しました';

}
);

/* ======================
   ENTER KEY
====================== */

apiKeyInput.addEventListener(
'keydown',
(event)=>{

if(
event.key === 'Enter'
){

saveKeyBtn.click();

}

}
);

/* ======================
   STARTUP
====================== */

if(GEMINI_KEY){

statusBox.textContent =
'準備完了！話しかけてね';

}else{

statusBox.textContent =
'Gemini APIキーを入力してください';

}

console.log(
'StackChan Part3 Loaded'
);

/* ======================
   第4回
   会話記憶
   音声ON/OFF
   履歴エクスポート
   感情強化
====================== */

/* ======================
   SETTINGS
====================== */

let voiceEnabled =
JSON.parse(
localStorage.getItem(
'STACKCHAN_VOICE'
) || 'true'
);

let chatMemory =
JSON.parse(
localStorage.getItem(
'STACKCHAN_MEMORY'
) || '[]'
);

/* ======================
   MEMORY
====================== */

function saveMemory(){

localStorage.setItem(
'STACKCHAN_MEMORY',
JSON.stringify(
chatMemory
)
);

}

function addMemory(
role,
text
){

chatMemory.push({
role,
text
});

if(
chatMemory.length > 20
){
chatMemory.shift();
}

saveMemory();

}

/* ======================
   PROMPT
====================== */

function buildPrompt(
userText
){

let history = '';

chatMemory.forEach(msg=>{

history +=
`${msg.role}: ${msg.text}\n`;

});

return `
あなたはスタックチャンです。

明るく親しみやすい友達です。

返答は日本語。

50文字以内。

会話履歴:
${history}

ユーザー:
${userText}
`;

}

/* ======================
   GEMINI MEMORY VERSION
====================== */

async function askGeminiMemory(
userText
){

if(!GEMINI_KEY){

return null;

}

try{

const response =
await fetch(

`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_KEY}`,

{
method:'POST',

headers:{
'Content-Type':
'application/json'
},

body:JSON.stringify({

contents:[{

parts:[{

text:
buildPrompt(
userText
)

}]

}],

generationConfig:{

temperature:0.9,

maxOutputTokens:80

}

})

}

);

if(!response.ok){

throw new Error(
response.status
);

}

const data =
await response.json();

const reply =
data?.candidates?.[0]
?.content?.parts?.[0]
?.text
?.trim();

if(!reply){

return null;

}

addMemory(
'user',
userText
);

addMemory(
'stackchan',
reply
);

return reply;

}
catch(err){

console.error(err);

return null;

}

}

/* ======================
   OVERRIDE
====================== */

if(recognition){

recognition.onresult =
async(event)=>{

const userText =
event.results[0][0]
.transcript
.trim();

listening = false;

addMessage(
'user',
`あなた: ${userText}`
);

pushHistory(
'user',
`あなた: ${userText}`
);

statusBox.textContent =
'考えています...';

emotionThinking();

const reply =
await askGeminiMemory(
userText
);

if(!reply){

emotionError();

statusBox.textContent =
'通信エラー';

return;

}

addMessage(
'ai',
`スタックチャン: ${reply}`
);

pushHistory(
'ai',
`スタックチャン: ${reply}`
);

statusBox.textContent =
reply;

if(
voiceEnabled
){

await speakText(
reply
);

}

};

}

/* ======================
   EMOTION
====================== */

function emotionThinking(){

faceThinking();

}

function emotionHappy(){

faceHappy();

setTimeout(
faceNormal,
1000
);

}

function emotionError(){

faceError();

setTimeout(
faceNormal,
1500
);

}

/* ======================
   VOICE TOGGLE
====================== */

const voiceToggle =
document.createElement(
'button'
);

voiceToggle.textContent =
voiceEnabled
? '🔊音声ON'
: '🔇音声OFF';

voiceToggle.style.marginLeft =
'8px';

document
.querySelector(
'.settingRow'
)
.appendChild(
voiceToggle
);

voiceToggle.onclick =
()=>{

voiceEnabled =
!voiceEnabled;

localStorage.setItem(
'STACKCHAN_VOICE',
JSON.stringify(
voiceEnabled
)
);

voiceToggle.textContent =
voiceEnabled
? '🔊音声ON'
: '🔇音声OFF';

};

/* ======================
   EXPORT HISTORY
====================== */

const exportBtn =
document.createElement(
'button'
);

exportBtn.textContent =
'履歴保存';

exportBtn.style.marginTop =
'8px';

document
.getElementById(
'settings'
)
.appendChild(
exportBtn
);

exportBtn.onclick =
()=>{

const blob =
new Blob(

[
JSON.stringify(
conversationHistory,
null,
2
)
],

{
type:
'application/json'
}

);

const url =
URL.createObjectURL(
blob
);

const a =
document.createElement(
'a'
);

a.href = url;

a.download =
'stackchan_history.json';

a.click();

URL.revokeObjectURL(
url
);

};

/* ======================
   AUTO SCROLL
====================== */

const observer =
new MutationObserver(
()=>{

historyBox.scrollTop =
historyBox.scrollHeight;

}
);

observer.observe(
historyBox,
{
childList:true
}
);

console.log(
'StackChan Part4 Loaded'
);

/* ======================
   最終回
   モデル選択
   起動診断
   連続会話モード
   UI仕上げ
====================== */

/* ======================
   MODEL SELECT
====================== */

let currentModel =
localStorage.getItem(
'STACKCHAN_MODEL'
) ||
'gemini-2.0-flash';

const modelSelect =
document.createElement(
'select'
);

[
'gemini-2.0-flash',
'gemini-2.0-flash-lite'
].forEach(model=>{

const option =
document.createElement(
'option'
);

option.value = model;
option.textContent = model;

if(
model === currentModel
){
option.selected = true;
}

modelSelect.appendChild(
option
);

});

modelSelect.style.width =
'100%';

modelSelect.style.marginTop =
'8px';

document
.getElementById(
'settings'
)
.appendChild(
modelSelect
);

modelSelect.onchange =
()=>{

currentModel =
modelSelect.value;

localStorage.setItem(
'STACKCHAN_MODEL',
currentModel
);

};

/* ======================
   PATCH MODEL
====================== */

const originalAskGeminiMemory =
askGeminiMemory;

askGeminiMemory =
async function(
userText
){

if(!GEMINI_KEY){

return null;

}

try{

const response =
await fetch(

`https://generativelanguage.googleapis.com/v1beta/models/${currentModel}:generateContent?key=${GEMINI_KEY}`,

{
method:'POST',

headers:{
'Content-Type':
'application/json'
},

body:JSON.stringify({

contents:[{

parts:[{
text:
buildPrompt(
userText
)
}]

}],

generationConfig:{

temperature:0.9,

maxOutputTokens:80

}

})

}

);

if(!response.ok){

throw new Error(
response.status
);

}

const data =
await response.json();

const reply =
data?.candidates?.[0]
?.content?.parts?.[0]
?.text
?.trim();

if(!reply){

return null;

}

addMemory(
'user',
userText
);

addMemory(
'stackchan',
reply
);

return reply;

}
catch(err){

console.error(err);

return null;

}

};

/* ======================
   CONTINUOUS MODE
====================== */

let continuousMode =
false;

const continuousBtn =
document.createElement(
'button'
);

continuousBtn.textContent =
'連続会話OFF';

continuousBtn.style.marginTop =
'8px';

document
.getElementById(
'settings'
)
.appendChild(
continuousBtn
);

continuousBtn.onclick =
()=>{

continuousMode =
!continuousMode;

continuousBtn.textContent =
continuousMode
? '連続会話ON'
: '連続会話OFF';

};

/* ======================
   PATCH SPEAK
====================== */

const originalSpeak =
speakText;

speakText =
async function(
text
){

await originalSpeak(
text
);

if(
continuousMode &&
recognition
){

setTimeout(()=>{

try{

faceListening();

statusBox.textContent =
'続けて聞いています...';

recognition.start();

listening = true;

}
catch(e){}

},300);

}

};

/* ======================
   STARTUP CHECK
====================== */

window.addEventListener(
'load',
()=>{

let warnings = [];

if(
!window.fetch
){
warnings.push(
'fetch未対応'
);
}

if(
!window.speechSynthesis
){
warnings.push(
'音声合成未対応'
);
}

if(
!SpeechRecognition
){
warnings.push(
'音声認識未対応'
);
}

if(
warnings.length
){
