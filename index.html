<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイ頭脳版・AIスタックチャン</title>
    <style>
        body {
            margin: 0;
            background-color: #f1c40f;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
            overflow: hidden;
            user-select: none;
        }
        #face {
            width: 320px;
            height: 220px;
            background-color: #2c3e50;
            border-radius: 40px;
            position: relative;
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
            transition: background-color 0.3s;
        }
        .eye {
            width: 50px;
            height: 50px;
            background-color: #00ffcc;
            border-radius: 50%;
            position: absolute;
            top: 65px;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #eye-left { left: 60px; }
        #eye-right { right: 60px; }
        #mouth {
            width: 44px;
            height: 20px;
            background-color: #00ffcc;
            position: absolute;
            bottom: 55px;
            left: 138px;
            border-radius: 8px;
            transition: all 0.1s ease;
        }
        #controls {
            margin-top: 20px;
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        button {
            padding: 12px 25px;
            font-size: 18px;
            font-weight: bold;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 10px rgba(0,0,0,0.2);
            transition: transform 0.1s, background-color 0.2s;
        }
        button:active { transform: scale(0.95); }
        #status {
            margin-top: 15px;
            color: #2c3e50;
            font-weight: bold;
            font-size: 15px;
            min-height: 24px;
            background: rgba(255,255,255,0.3);
            padding: 8px 15px;
            border-radius: 15px;
            word-break: break-all;
        }
        #key-area {
            margin-top: 15px;
            background: rgba(0,0,0,0.1);
            padding: 10px;
            border-radius: 10px;
        }
        #key-input {
            padding: 8px;
            width: 70%;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div id="face">
        <div id="eye-left" class="eye"></div>
        <div id="eye-right" class="eye"></div>
        <div id="mouth"></div>
    </div>

    <div id="controls">
        <button id="talk-btn">話しかける</button>
        <div id="status">APIキーを入力して「保存」を押してね</div>
        
        <div id="key-area">
            <input type="password" id="key-input" placeholder="AIzaSy...（Gemini APIキー）">
            <button id="save-key-btn" style="padding: 6px 12px; font-size: 12px; background-color: #34495e;">保存</button>
        </div>
    </div>

    <script>
        const talkBtn = document.getElementById('talk-btn');
        const statusText = document.getElementById('status');
        const mouth = document.getElementById('mouth');
        const eyeLeft = document.getElementById('eye-left');
        const eyeRight = document.getElementById('eye-right');
        const keyInput = document.getElementById('key-input');
        const saveKeyBtn = document.getElementById('save-key-btn');

        // ブラウザの秘密の記憶領域からキーを読み込む
        let myApiKey = localStorage.getItem('STACKJAN_GEMINI_KEY') || '';
        if (myApiKey) {
            keyInput.value = myApiKey;
            statusText.innerText = "本物のAIがロードされたよ！お話ししよう！";
        }

        // キーの保存処理（あなたのスマホ・PC内にだけ記憶され、ネットには漏れません）
        saveKeyBtn.addEventListener('click', () => {
            const token = keyInput.value.trim();
            if (!token) {
                alert('キーを入力してください');
                return;
            }
            localStorage.setItem('STACKJAN_GEMINI_KEY', token);
            myApiKey = token;
            statusText.innerText = "キーを記憶したよ！お話ししよう！";
            alert('APIキーをブラウザに安全に保存しました。');
        });

        // まばたき
        setInterval(() => {
            const currentHeight = eyeLeft.style.height;
            if(currentHeight && currentHeight !== '50px') return; 
            eyeLeft.style.height = '5px'; eyeRight.style.height = '5px';
            setTimeout(() => { eyeLeft.style.height = '50px'; eyeRight.style.height = '50px'; }, 150);
        }, 4000);

        // 音声認識
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            statusText.innerText = "ブラウザが音声認識に対応していません。";
        } else {
            const recognition = new SpeechRecognition();
            recognition.lang = 'ja-JP';

            talkBtn.addEventListener('click', () => {
                if(!myApiKey) {
                    alert('先に下の欄にAPIキーを入力して「保存」を押してね！');
                    return;
                }
                recognition.start();
                statusText.innerText = "きいているよ...👂";
                talkBtn.style.backgroundColor = "#2ecc71";
            });

            recognition.onresult = async (event) => {
                const userSpeech = event.results[0][0].transcript;
                statusText.innerText = `AI思考中...🤔 (${userSpeech})`;
                talkBtn.style.backgroundColor = "#e74c3c";
                
                await generateRealAIResponse(userSpeech);
            };

            recognition.onerror = () => {
                statusText.innerText = "聞き取れなかったよ。もう一度押してね。";
                talkBtn.style.backgroundColor = "#e74c3c";
            };
        }

        // 最新仕様の通信処理
        async function generateRealAIResponse(userInput) {
            try {
                const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${myApiKey}`;
                
                const requestBody = {
                    contents: [{
                        role: "user",
                        parts: [{ text: `指示：あなたは『スタックチャン』という名前の可愛いロボットAIです。ユーザーの友達として、親しみやすく短くフレンドリーに日本語で回答してください。必ず語尾に『だよ』『なのだ』『ね！』などを混ぜた可愛いタメ口にし、1文か2文（35文字以内）で簡潔に答えること。\n\nユーザーの発言：${userInput}` }]
                    }],
                    generationConfig: { maxOutputTokens: 60, temperature: 0.7 }
                };

                const response = await fetch(endpoint, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(requestBody)
                });

                const data = await response.json();

                if (data.error) {
                    statusText.innerText = `Googleエラー: ${data.error.message}`;
                    return;
                }

                let replyText = data.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || "";

                if (!replyText) {
                    statusText.innerText = "AIの返答が空っぽだったよ。もう一度試してね。";
                    return;
                }

                statusText.innerText = `スタックチャン: ${replyText}`;
                speak(replyText);
            } catch (e) {
                statusText.innerText = `エラー: 通信に失敗したのだ。`;
                console.error(e);
            }
        }

        // 音声合成と口パク
        function speak(text) {
            const uttr = new SpeechSynthesisUtterance(text);
            uttr.lang = 'ja-JP'; uttr.pitch = 1.3; uttr.rate = 1.15;

            let mouthInterval = setInterval(() => {
                const randomHeight = Math.floor(Math.random() * 35) + 5;
                mouth.style.height = `${randomHeight}px`;
                mouth.style.transform = `translateY(${(20 - randomHeight) / 2}px)`;
            }, 80);

            uttr.onend = () => {
                clearInterval(mouthInterval);
                mouth.style.height = "20px"; mouth.style.transform = "translateY(0px)";
            };
            window.speechSynthesis.speak(uttr);
        }
    </script>
</body>
</html>
