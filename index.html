<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AI SAUSAGE Ultimate Hybrid</title>
<style>
:root{
  --bg:#10151d;
  --panel:#1b2430;
  --face:#243447;
  --accent:#00ffd0;
  --text:#ffffff;
  --danger:#ff5f57;
}
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html, body{
  width:100%;
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:sans-serif;
  overflow:hidden;
}
body{
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* ======================
   FACE
====================== */
#faceArea{
  padding-top:18px;
}
#face{
  width:min(90vw,340px);
  height:min(62vw,230px);
  background:var(--face);
  border-radius:40px;
  position:relative;
  box-shadow:0 15px 30px rgba(0,0,0,0.4);
  transition:.25s;
  overflow:hidden;
}
.eye{
  position:absolute;
  width:52px;
  height:52px;
  border-radius:50%;
  background:var(--accent);
  top:70px;
  transition:.15s;
}
#eyeL{ left:65px; }
#eyeR{ right:65px; }
#mouth{
  position:absolute;
  left:50%;
  bottom:55px;
  transform:translateX(-50%);
  width:54px;
  height:18px;
  background:var(--accent);
  border-radius:8px;
  transition:.08s;
}

/* ======================
   STATUS
====================== */
#status{
  margin-top:12px;
  width:min(95vw,700px);
  padding:10px;
  background:var(--panel);
  border-radius:12px;
  font-size:14px;
  text-align:center;
  min-height:42px;
  word-break:break-all;
}

/* ======================
   BUTTONS
====================== */
#buttonBar{
  display:flex;
  gap:8px;
  margin-top:10px;
  flex-wrap:wrap;
  justify-content:center;
}
button, select{
  border:none;
  border-radius:12px;
  padding:12px 16px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}
select {
  background: #34495e;
  color: white;
  font-family: sans-serif;
}
#talkBtn{ background:#2ecc71; color:white; }
#stopBtn{ background:#e74c3c; color:white; }
#clearBtn{ background:#3498db; color:white; }

/* ======================
   SETTINGS
====================== */
#settings{
  margin-top:12px;
  width:min(95vw,700px);
  background:var(--panel);
  padding:12px;
  border-radius:12px;
}
#settings h3{
  margin-bottom:8px;
}
#apiKey{
  width:100%;
  padding:10px;
  border:none;
  border-radius:8px;
  background: #fff;
  color: #000;
}
.settingRow{
  display:flex;
  gap:8px;
  margin-top:8px;
  flex-wrap: wrap;
}
.settingRow button, .settingRow select{
  flex:1;
  min-width: 120px;
}

/* ======================
   HISTORY
====================== */
#history{
  margin-top:12px;
  width:min(95vw,700px);
  flex:1;
  overflow:auto;
  background:var(--panel);
  border-radius:12px;
  padding:12px;
  margin-bottom:12px;
}
.message{
  padding:8px;
  border-radius:10px;
  margin-bottom:8px;
  line-height:1.5;
  word-break:break-word;
}
.user{ background:#34495e; }
.ai{ background:#22313f; border-left:4px solid var(--accent); }

/* ======================
   MOBILE
====================== */
@media(max-width:500px){
  .eye{ width:42px; height:42px; top:60px; }
  #eyeL{ left:50px; }
  #eyeR{ right:50px; }
}
</style>
</head>
<body>

<div id="faceArea">
  <div id="face">
    <div id="eyeL" class="eye"></div>
    <div id="eyeR" class="eye"></div>
    <div id="mouth"></div>
  </div>
</div>

<div id="status">APIキーを設定してください</div>

<div id="buttonBar">
  <button id="talkBtn">🎤 話しかける</button>
  <button id="stopBtn">🔇 停止</button>
  <button id="clearBtn">🗑 履歴削除</button>
</div>

<div id="settings">
  <h3>設定</h3>
  <input type="password" id="apiKey" placeholder="API Keyを入力">
  <div class="settingRow">
    <button id="saveKeyBtn">保存</button>
    <button id="testKeyBtn">接続テスト</button>
  </div>
</div>

<div id="history"></div>

<script>
/* ======================
   DOM ELEMENT ACQUISITION
====================== */
const face = document.getElementById('face');
const eyeL = document.getElementById('eyeL');
const eyeR = document.getElementById('eyeR');
const mouth = document.getElementById('mouth');
const statusBox = document.getElementById('status');
const historyBox = document.getElementById('history');
const apiKeyInput = document.getElementById('apiKey');
const talkBtn = document.getElementById('talkBtn');
const stopBtn = document.getElementById('stopBtn');
const clearBtn = document.getElementById('clearBtn');
const saveKeyBtn = document.getElementById('saveKeyBtn');
const testKeyBtn = document.getElementById('testKeyBtn');
const settingRow = document.querySelector('.settingRow');
const settingsDiv = document.getElementById('settings');

/* ======================
   STATE MANAGEMENT
====================== */
let GEMINI_KEY = localStorage.getItem('SAUSAGE_GEMINI_KEY') || '';
let GROQ_KEY = localStorage.getItem('SAUSAGE_GROQ_KEY') || '';

let listening = false;
let speaking = false;
let recognition = null;
let mouthTimer = null;

let voiceEnabled = JSON.parse(localStorage.getItem('SAUSAGE_VOICE') || 'true');
let continuousMode = false;

// 選択中のAIプロバイダー（'gemini' or 'groq'）
let currentProvider = localStorage.getItem('SAUSAGE_PROVIDER') || 'gemini';

let conversationHistory = JSON.parse(localStorage.getItem('SAUSAGE_HISTORY') || '[]');
let chatMemory = JSON.parse(localStorage.getItem('SAUSAGE_MEMORY') || '[]');

/* ======================
   DYNAMIC UI INITIALIZATION
====================== */
const voiceToggle = document.createElement('button');
voiceToggle.textContent = voiceEnabled ? '🔊音声ON' : '🔇音声OFF';
settingRow.appendChild(voiceToggle);

// モデル選択（プロバイダー選択）要素の作成
const modelSelect = document.createElement('select');

const optGemini = document.createElement('option');
optGemini.value = 'gemini';
optGemini.textContent = 'gemini-2.0-flash';
if(currentProvider === 'gemini') optGemini.selected = true;
modelSelect.appendChild(optGemini);

const optGroq = document.createElement('option');
optGroq.value = 'groq';
optGroq.textContent = 'llama3.1-8b-instant';
if(currentProvider === 'groq') optGroq.selected = true;
modelSelect.appendChild(optGroq);

settingRow.appendChild(modelSelect);

const continuousBtn = document.createElement('button');
continuousBtn.textContent = '連続会話OFF';
settingRow.appendChild(continuousBtn);

const exportBtn = document.createElement('button');
exportBtn.textContent = '履歴をファイル保存';
exportBtn.style.width = '100%';
exportBtn.style.marginTop = '8px';
settingsDiv.appendChild(exportBtn);

// 初期表示時の入力欄のプレースホルダーと値の制御
function updateKeyInputDisplay() {
  if (modelSelect.value === 'gemini') {
    apiKeyInput.value = GEMINI_KEY;
    apiKeyInput.placeholder = "Gemini API Key (AIzaSy...)";
  } else {
    apiKeyInput.value = GROQ_KEY;
    apiKeyInput.placeholder = "Groq API Key (gsk_...)";
  }
}
updateKeyInputDisplay();

/* ======================
   FACE ANIMATIONS & EMOTIONS
====================== */
function faceNormal()   { face.style.background = '#243447'; }
function faceListening(){ face.style.background = '#2c3e50'; }
function faceThinking() { face.style.background = '#5d4037'; }
function faceHappy()    { face.style.background = '#145a32'; }
function faceError()    { face.style.background = '#7b241c'; }

function emotionThinking() { faceThinking(); }
function emotionHappy()    { faceHappy(); setTimeout(faceNormal, 1000); }
function emotionError()    { faceError(); setTimeout(faceNormal, 1500); }

setInterval(() => {
  eyeL.style.height = '5px';
  eyeR.style.height = '5px';
  setTimeout(() => {
    eyeL.style.height = '52px';
    eyeR.style.height = '52px';
  }, 150);
}, 4000);

function startMouth() {
  clearInterval(mouthTimer);
  mouthTimer = setInterval(() => {
    const h = Math.floor(Math.random() * 35) + 8;
    mouth.style.height = `${h}px`;
  }, 80);
}

function stopMouth() {
  clearInterval(mouthTimer);
  mouth.style.height = '18px';
}

/* ======================
   HISTORY & MEMORY HANDLERS
====================== */
function addMessage(type, text) {
  const div = document.createElement('div');
  div.className = `message ${type}`;
  div.textContent = text;
  historyBox.appendChild(div);
  historyBox.scrollTop = historyBox.scrollHeight;
}

conversationHistory.forEach(item => addMessage(item.type, item.text));

function saveHistory() {
  localStorage.setItem('SAUSAGE_HISTORY', JSON.stringify(conversationHistory));
}

function pushHistory(type, text) {
  conversationHistory.push({ type, text });
  if(conversationHistory.length > 100) conversationHistory.shift();
  saveHistory();
}

function saveMemory() {
  localStorage.setItem('SAUSAGE_MEMORY', JSON.stringify(chatMemory));
}

function addMemory(role, text) {
  chatMemory.push({ role, text });
  if(chatMemory.length > 20) chatMemory.shift();
  saveMemory();
}

/* ======================
   PROMPT BUILDERS
====================== */
function buildGeminiPrompt(userText) {
  let history = '';
  chatMemory.forEach(msg => {
    // Groq形式のrole名を変換
    const r = (msg.role === 'assistant' || msg.role === 'stackchan' || msg.role === 'sausage') ? 'sausage' : 'user';
    history += `${r}: ${msg.text}\n`;
  });
  return `あなたはSAUSAGEです。明るく親しみやすい友達です。返答は日本語。50文字以内。\n\n会話履歴:\n${history}\nユーザー:\n${userText}`;
}

function buildGroqMessages(userText) {
  let messages = [
    { role: 'system', content: 'あなたはSAUSAGEです。明るく親しみやすい友達です。返答は日本語。50文字以内。' }
  ];
  chatMemory.forEach(msg => {
    const r = (msg.role === 'stackchan' || msg.role === 'sausage' || msg.role === 'assistant') ? 'assistant' : 'user';
    messages.push({ role: r, content: msg.text });
  });
  messages.push({ role: 'user', content: userText });
  return messages;
}

/* ======================
   UNIVERSAL API COMMUNICATOR
====================== */
async function askAI(userText) {
  const provider = modelSelect.value;
  
  if(provider === 'gemini') {
    if(!GEMINI_KEY) { statusBox.textContent = 'Gemini APIキー未設定'; emotionError(); return null; }
    return await askGemini(userText);
  } else {
    if(!GROQ_KEY) { statusBox.textContent = 'Groq APIキー未設定'; emotionError(); return null; }
    return await askGroq(userText);
  }
}

// Gemini通信用
async function askGemini(userText) {
  try {
    emotionThinking();
    statusBox.textContent = '考え中(Gemini)...';

    const response = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_KEY}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: buildGeminiPrompt(userText) }] }],
          generationConfig: { temperature: 0.9, maxOutputTokens: 80 }
        })
      }
    );

    if(!response.ok) {
      let details = '';
      try { const errData = await response.json(); details = errData.error?.message || ''; } catch(_) {}
      throw new Error(`HTTP ${response.status} ${details}`.trim());
    }

    const data = await response.json();
    const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text?.trim();
    if(!reply) throw new Error('返答データが空です');

    addMemory('user', userText);
    addMemory('sausage', reply);
    return reply;

  } catch(err) {
    console.error(err);
    statusBox.textContent = '通信エラー: ' + err.message;
    emotionError();
    return null;
  }
}

// Groq通信用
async function askGroq(userText) {
  try {
    emotionThinking();
    statusBox.textContent = '考え中(Groq)...';

    const response = await fetch(
      'https://api.groq.com/openai/v1/chat/completions',
      {
        method: 'POST',
        headers: { 
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${GROQ_KEY}`
        },
        body: JSON.stringify({
          model: 'llama3.1-8b-instant',
          messages: buildGroqMessages(userText),
          temperature: 0.9,
          max_tokens: 80
        })
      }
    );

    if(!response.ok) {
      let details = '';
      try { const errData = await response.json(); details = errData.error?.message || ''; } catch(_) {}
      throw new Error(`HTTP ${response.status} ${details}`.trim());
    }

    const data = await response.json();
    const reply = data?.choices?.[0]?.message?.content?.trim();
    if(!reply) throw new Error('返答データが空です');

    addMemory('user', userText);
    addMemory('assistant', reply);
    return reply;

  } catch(err) {
    console.error(err);
    statusBox.textContent = '通信エラー: ' + err.message;
    emotionError();
    return null;
  }
}

/* ======================
   AUDIO SYNTHESIS (TTS)
====================== */
function speakText(text) {
  return new Promise(resolve => {
    window.speechSynthesis.cancel();
    
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'ja-JP';
    utter.pitch = 1.2;
    utter.rate = 1.05;

    speaking = true;
    faceHappy();
    startMouth();

    utter.onend = () => {
      speaking = false;
      stopMouth();
      faceNormal();
      handleContinuousListening();
      resolve();
    };

    utter.onerror = (e) => {
      console.error(e);
      speaking = false;
      stopMouth();
      faceNormal();
      handleContinuousListening();
      resolve();
    };

    window.speechSynthesis.speak(utter);
  });
}

function handleContinuousListening() {
  if (continuousMode && recognition && !listening) {
    setTimeout(() => {
      try {
        listening = true;
        faceListening();
        statusBox.textContent = '続けて聞いています...';
        recognition.start();
      } catch(e) { 
        console.error("連続認識の起動に失敗:", e); 
        listening = false;
      }
    }, 300);
  }
}

/* ======================
   SPEECH RECOGNITION (STT)
====================== */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if(SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.lang = 'ja-JP';
  recognition.interimResults = false;
  recognition.continuous = false;

  recognition.onresult = async (event) => {
    const userText = event.results[0][0].transcript.trim();
    listening = false;

    addMessage('user', `あなた: ${userText}`);
    pushHistory('user', `あなた: ${userText}`);

    const reply = await askAI(userText);
    if(!reply) return;

    addMessage('ai', `SAUSAGE: ${reply}`);
    pushHistory('ai', `SAUSAGE: ${reply}`);
    statusBox.textContent = reply;

    if(voiceEnabled) {
      await speakText(reply);
    } else {
      emotionHappy();
      handleContinuousListening();
    }
  };

  recognition.onerror = (event) => {
    console.error(event);
    listening = false;
    emotionError();
    statusBox.textContent = '聞き取れませんでした';
  };

  recognition.onend = () => {
    listening = false;
    if(!speaking) faceNormal();
  };
} else {
  statusBox.textContent = '音声認識非対応ブラウザ';
}

/* ======================
   UI EVENT LISTENERS
====================== */
// モデルセレクトボックス切り替え時
modelSelect.addEventListener('change', () => {
  currentProvider = modelSelect.value;
  localStorage.setItem('SAUSAGE_PROVIDER', currentProvider);
  updateKeyInputDisplay();
  statusBox.textContent = `${modelSelect.options[modelSelect.selectedIndex].text} モードに切り替えました`;
});

// 話しかけるボタン
talkBtn.addEventListener('click', () => {
  if(!recognition) return alert('音声認識に対応していません');
  const currentKey = (modelSelect.value === 'gemini') ? GEMINI_KEY : GROQ_KEY;
  if(!currentKey) return alert('選択中モデルのAPIキーを設定してください');
  if(listening) return;

  try {
    listening = true;
    faceListening();
    statusBox.textContent = '聞いています...';
    recognition.start();
  } catch(err) {
    console.error(err);
    listening = false;
  }
});

// 停止ボタン
stopBtn.addEventListener('click', () => {
  window.speechSynthesis.cancel();
  if(recognition) {
    try { recognition.stop(); } catch(e){}
  }
  listening = false;
  speaking = false;
  stopMouth();
  faceNormal();
  statusBox.textContent = '停止しました';
});

// 履歴削除ボタン
clearBtn.addEventListener('click', () => {
  if(!confirm('履歴を削除しますか？')) return;
  conversationHistory = [];
  chatMemory = [];
  localStorage.removeItem('SAUSAGE_HISTORY');
  localStorage.removeItem('SAUSAGE_MEMORY');
  historyBox.innerHTML = '';
  statusBox.textContent = '履歴を削除しました';
});

// APIキー保存
saveKeyBtn.addEventListener('click', () => {
  const key = apiKeyInput.value.trim();
  if(!key) return alert('APIキーを入力してください');

  if(modelSelect.value === 'gemini') {
    GEMINI_KEY = key;
    localStorage.setItem('SAUSAGE_GEMINI_KEY', key);
    statusBox.textContent = 'Gemini APIキーを保存しました';
  } else {
    GROQ_KEY = key;
    localStorage.setItem('SAUSAGE_GROQ_KEY', key);
    statusBox.textContent = 'Groq APIキーを保存しました';
  }
  emotionHappy();
});

// 接続テストボタン
testKeyBtn.addEventListener('click', async () => {
  const key = apiKeyInput.value.trim();
  if(!key) return alert('APIキーを入力してください');

  if(modelSelect.value === 'gemini') {
    GEMINI_KEY = key;
    localStorage.setItem('SAUSAGE_GEMINI_KEY', key);
  } else {
    GROQ_KEY = key;
    localStorage.setItem('SAUSAGE_GROQ_KEY', key);
  }
  
  statusBox.textContent = '接続確認中...';
  const result = await askAI('こんにちは');
  if(result) {
    statusBox.textContent = '接続成功: ' + result;
    emotionHappy();
  }
});

// 音声トグル
voiceToggle.onclick = () => {
  voiceEnabled = !voiceEnabled;
  localStorage.setItem('SAUSAGE_VOICE', JSON.stringify(voiceEnabled));
  voiceToggle.textContent = voiceEnabled ? '🔊音声ON' : '🔇音声OFF';
};

// 連続会話トグル
continuousBtn.onclick = () => {
  continuousMode = !continuousMode;
  continuousBtn.textContent = continuousMode ? '連続会話ON' : '連続会話OFF';
  if(continuousMode && !listening && !speaking) {
    handleContinuousListening();
  }
};

// 履歴エクスポート
exportBtn.onclick = () => {
  const blob = new Blob([JSON.stringify(conversationHistory, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'sausage_history.json';
  a.click();
  URL.revokeObjectURL(url);
};

apiKeyInput.addEventListener('keydown', (event) => {
  if(event.key === 'Enter') saveKeyBtn.click();
});

/* ======================
   AUTO SCROLL OBSERVER
====================== */
const observer = new MutationObserver(() => {
  historyBox.scrollTop = historyBox.scrollHeight;
});
observer.observe(historyBox, { childList: true });

/* ======================
   STARTUP CHECK
====================== */
window.addEventListener('load', () => {
  let warnings = [];
  if(!window.fetch) warnings.push('fetch未対応');
  if(!window.speechSynthesis) warnings.push('音声合成未対応');
  if(!SpeechRecognition) warnings.push('音声認識未対応');

  if(warnings.length) {
    statusBox.textContent = warnings.join(' / ');
    faceError();
  } else {
    const currentKey = (modelSelect.value === 'gemini') ? GEMINI_KEY : GROQ_KEY;
    if(currentKey) {
      statusBox.textContent = 'ハイブリッド起動完了！準備OKだよ';
      emotionHappy();
    } else {
      statusBox.textContent = 'APIキーを入力してください';
    }
  }
});

console.log('AI SAUSAGE Ultimate Hybrid Edition v2 (Optimized)');
</script>
</body>
</html>
